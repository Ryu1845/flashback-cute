[project]
name = "flashback-cute"
version = "0.1.0"
description = "Fused softmax-attention double backward (flashback) on FlashAttention-4 CuTe DSL kernels (SM90)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0+cu128",
    "flash-attn-4==4.0.0b32",
    "nvidia-cutlass-dsl==4.8.0",
    "quack-kernels==0.6.5",
    "cuda-python<13",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flashback_cute"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
